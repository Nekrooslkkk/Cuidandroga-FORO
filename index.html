<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUIDANDROGA</title>
<link rel="stylesheet" href="css/aero.css">
<script>try{var p=JSON.parse(localStorage.getItem('cd_prefs')||'{}'),t=p.tema||localStorage.getItem('cd_tema');if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>
</head>
<body>
<div class="fondo" id="fondo" aria-hidden="true"></div>

<header id="barra">
  <a class="marca" href="index.html" title="Volver al inicio"><h1>CUIDANDROGA</h1></a>
  <div class="barra-hueco"></div>
  <div class="acciones">
    <button id="btnPanel" class="btn-panel" hidden title="Panel de moderación" aria-label="Panel de moderación"></button>
    <button id="btnTema" class="btn-pildora" title="Modo oscuro" aria-label="Modo oscuro"><span class="pildora"><i></i><i></i></span></button>
    <button id="btnCuenta" class="btn-cuenta"><span id="cuentaAv" class="mini-av"></span><span id="cuentaTxt" class="cuenta-txt">LOGIN</span></button>
    <button id="btnPublicar" class="btn-caja" aria-label="Publicar"><span class="caja-tapa"></span><span class="caja-frente">PUBLICAR</span></button>
  </div>
</header>
<div id="franjaRol" class="franja-rol" hidden></div>

<main id="escritorio">
  <section class="centro">
    <div id="avisos" class="avisos"></div>
    <section id="tablones" class="tablones" aria-label="Foros"></section>
  </section>

  <aside id="lateral">
    <section class="ventana lat encuesta-lat" data-lat="encuesta">
      <div class="cap"><span class="cap-ico atencion-ico">!</span><span class="cap-titulo">ENCUESTA</span>
        <span class="cap-btns"><button class="cb min" data-lat-min aria-label="Minimizar"></button></span></div>
      <div class="lat-cuerpo">
        <div class="banda"><div class="banda-lineas"></div><div class="banda-brillo"></div></div>
        <div class="atencion"><span class="atencion-ico">!</span>Responde esta encuesta y gana un libro a elección</div>
        <div class="lat-pie"><a class="btn-aero" href="encuesta.html">¡Responde ya la encuesta!</a></div>
      </div>
    </section>

    <section class="ventana lat" data-lat="notis">
      <div class="cap"><span class="cap-titulo">NOTIFICACIONES <span id="notiCuenta"></span></span>
        <span class="cap-btns"><button class="cb min" data-lat-min aria-label="Minimizar"></button><button class="cb cerrar" id="notiCerrar" aria-label="Borrar notificaciones"></button></span></div>
      <div class="lat-cuerpo"><div id="notiLista" class="noti-lista frag"></div></div>
    </section>

    <section class="ventana lat" data-lat="activos">
      <div class="cap"><span class="cap-titulo">USUARIOS ACTIVOS <span id="activosCuenta"></span></span>
        <span class="cap-btns"><button class="cb min" data-lat-min aria-label="Minimizar"></button></span></div>
      <div class="lat-cuerpo"><ul id="activosLista" class="activos-lista frag"></ul></div>
    </section>
  </aside>
</main>
<div id="tareas" class="tareas"></div>

<script src="js/vendor/d3-array.min.js"></script>
<script src="js/vendor/d3-geo.min.js"></script>
<script src="js/vendor/tierra.js"></script>
<script src="js/datos.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/fondo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
